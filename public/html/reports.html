<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Generating Reports</title>
    <link rel="stylesheet" href="../css/reports.css"> 
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/supplierReport.css">
  </head>

  <body>
    <h1 style="text-align: center;">Generating Reports</h1>

    <div id="meni" class="sidenav">
      <a href="/deliveries">Deliveries</a>
      <a href="/suppliers">Suppliers</a>
      <a href="/contracts">Contracts</a>
      <a href="/quickcontracts">Quick contracts</a>
      <a href="/reports">Reports</a>
      <a href="/login">Log out</a>
    </div>

    <div style="margin-left:220px; padding:20px;">
        <label for="reportType">Select Report Type:</label>
        <select id="reportType">
            <option  value="">Unselected Report Type</option>
            <option value="promet">Best-Selling Medication</option>
            <option value="suppliers">Suppliers</option>
            <option value="contracts">Contracts</option>
            <option value="deliveries">Deliveries</option>
        </select>

        <br>
        <hr>
        <br>
        
        <div id="report-promet" class="report-section" style="display:none;">
          <label for="startDate-promet">From Date:</label>
          <input type="date" id="startDate-promet">
          <br>

          <label for="endDate-promet">To Date:</label>
          <input type="date" id="endDate-promet">
          <br>
         
          <button id="generateReportBtn-promet">Show Report</button>
          <button id="downloadReportBtn-promet" onclick="downloadPDF('promet')" >Download Report</button>
          <br>
          <br>
          
          <table id="reportsTable-promet">
            <thead>
              <tr>
                <th>Name</th>
                <th>Supplier</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Profit</th>
              </tr>
            </thead>
        
            <tbody>
            </tbody>
          </table>
        </div>
        
        <div id="report-contracts" class="report-section" style="display:none;">
          <label for="startDate-contracts">From Date:</label>
          <input type="date" id="startDate-contracts">
          <br>

          <label for="endDate-contracts">To Date:</label>
          <input type="date" id="endDate-contracts">
          <br>

          <button id="generateReportBtn-contracts">Show Report</button>
          <button id="downloadReportBtn-contracts" onclick="downloadPDF('contracts')" >Download Report</button>
          <br>
          <br>
        
          <table id="reportsTable-contracts" class="transposed-table">
            <thead>
              <tr>
                <th></th>
                <th>Values</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th>Total</th>
                <td></td>
              </tr>
              <tr>
                <th>Completed</th>
                <td></td>
              </tr>
              <tr>
                <th>Failed</th>
                <td></td>
              </tr>
              <tr>
                <th>Pending</th>
                <td></td>
              </tr>
              <tr>
                <th>Active</th>
                <td></td>
              </tr>
              <tr>
                <th>Changes</th>
                <td></td>
              </tr>
            </tbody>
          </table>
          
        </div>
        
        <div id="report-deliveries" class="report-section" style="display:none;">
          <label for="startDate-deliveries">From Date:</label>
          <input type="date" id="startDate-deliveries">
          <br>
          
          <label for="endDate-deliveries">To Date:</label>
          <input type="date" id="endDate-deliveries">
          <br>

          <button id="generateReportBtn-deliveries">Show Report</button>
          <button id="downloadReportBtn-deliveries" onclick="downloadPDF('deliveries')" >Download Report</button>
          <br>
          <br>
    
          <table id="reportsTable-deliveries" class="transposed-table">
            <thead>
              <tr>
                <th></th>
                <th>Values</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th>Total</th>
                <td></td>
              </tr>
              <tr>
                <th>Finished</th>
                <td></td>
              </tr>
              <tr>
                <th>Incomplete</th>
                <td></td>
              </tr>
              <tr>
                <th>Suspended</th>
                <td></td>
              </tr>
              <tr>
                <th>Active</th>
                <td></td>
              </tr>
              <tr>
                <th>Total amount</th>
                <td></td>
              </tr>
            </tbody>
          </table>
          
        </div>

        <div id="report-suppliers" class="report-section" style="display: none;">
          <button id="showTableBtn">Show Report</button>
          <button id="generateReportBtn" onclick="downloadPDF('supplierReport')" >Download Report</button>
          <br>
          <br>
          <div id="reportTableContainer">

          </div>


        </div>

    </div>

    <script src="../scripts/reports.js"></script>
    <script src="../scripts/supplierReport.js"></script>
  </body>
</html>
