<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Contrats</title>
    <link rel="stylesheet" href="../css/reports.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/quickContracts.css" />

  </head>

  <body>
    <h1 style="text-align: center;">Automatic contract generation</h1>

    <div id="meni" class="sidenav">
      <a href="/managerdash">Dashboard</a>
      <a href="/deliveries">Deliveries</a>
      <a href="/suppliers">Suppliers</a>
      <a href="/contracts">Contracts</a>
      <a href="/quickcontracts">Quick contracts</a>
      <a href="/reports">Reports</a>
      <a href="/login">Log out</a>
    </div>

    <div style="margin-left:15%; padding:20px;">
      <label for="contractType">Choose Order Type:</label>

      <select id="contractType">
        <option value="">Select Order Type</option>
        <option value="expiring">Ordering medicines with a critical expiration date</option>
        <option value="bestsellers">Ordering the best-selling medicines</option>
      </select>

      <button id="generateReportBtn">Send Orders</button>
      <br>
      <br>

      <table id="quickContractsTable">
        <thead>
          <tr>
            <th>Medication Name</th>
            <th>Supplier</th>
            <th>Current Quantity</th>
            <th>Selling Price</th>
            <th>Purchase Quantity</th>
            <th>Purchase Price</th>
            <th>Order</th>
          </tr>
        </thead>

        <tbody>
          <!-- Popunjava se putem JS-a -->
        </tbody>
      </table>
    </div>

    <script src="../scripts/quickContracts.js"></script>
  </body>

  <div id="toast" class="toast hidden">Contracts successfully formed.</div>
    
</html>
