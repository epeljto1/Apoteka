<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Supplier Records</title>
    <link rel="stylesheet" href="../css/suppliers.css">
    <link rel="stylesheet" href="../css/sidebar.css">
  </head>

  <body>
    <h1 style="text-align: center;">Supplier Records</h1>

    <div id="meni" class="sidenav">
      <a href="/deliveries">Deliveries</a>
      <a href="/suppliers">Suppliers</a>
      <a href="/contracts">Contracts</a>
      <a href="/quickcontracts">Quick contracts</a>
      <a href="/reports">Reports</a>
      <a href="/login">Log out</a>
    </div>

    <div style="margin-left:220px; padding:20px;">
      <input type="text" id="searchInput" placeholder="Search by supplier name...">
      <button id="addSupplierBtn">Add New Supplier</button>
      <table id="suppliersTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact Number</th>
            <th>Details</th>
            <th>Delete</th>
          </tr>
        </thead>
      
        <tbody>
          <!-- Ovdje idu dobavljaci -->
        </tbody>
      </table>
    </div>

    <div id="addSupplierModal" class="modal" style="display:none;">
      <div class="modal-content">
        <span id="closeModal" style="float:right; cursor:pointer;">&times;</span>
        <h2>Add New supplier</h2>

        <form id="addSupplierForm">
          <input type="text" id="name" placeholder="Name" required><br><br>
          <input type="text" id="contactNumber" placeholder="Contact Number" required><br><br>
          <input type="email" id="email" placeholder="Email" required><br><br>
          <input type="text" id="address" placeholder="Address" required><br><br>
          <input type="text" id="website" placeholder="Website" required><br><br>
          <button type="submit">Add</button>
        </form>
      </div>  
    </div>
  
    <script src="../scripts/suppliers.js"></script>

  </body>
</html>
