<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create contract</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/createcontract.css">
</head>

<body>
    <div id="shape"></div>

    <form id="contractForm">

        <a id="backButton" href="/contracts">Cancel</a>

        <h1>Create new contract</h1>
        <hr>
        <h2>Contract info</h2>

        <label>Subject:</label><br>
        <input type="text" name="subject" required>

        <label>Conclusion date:</label>
        <input id="conclusionDateField" type="date" name="conclusionDate" required>

        <label>Expiration date:</label>
        <input id="expirationDateField" type="date" name="expirationDate" required><br>

        <label>Conditions:</label>
        <textarea name="conditions" rows="4" style="width: 100%;" required></textarea>
        <br>
        <br>

        <label>Status:</label>
        <select name="status" required>
            <option value="Active">Active</option>
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Failed">Failed</option>
        </select>

     <label>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Supplier:</label>
     <select name="supplierId" id="supplierSelect" required></select>


        <hr>
        <h2>Delivery info</h2>

        <label>Delivery date:</label>
        <input id="deliveryDateField" type="date" name="deliveryDate" required>

        <label>Delivery status:</label>
        <select name="deliveryStatus" required>
            <option value="Finished">Finished</option>
            <option value="Active">Active</option>
            <option value="Incomplete">Incomplete</option>
            <option value="Suspended">Suspended</option>
        </select>

        <hr>
        <h2>Invoice items</h2>

        <div class="items-container" id="itemsContainer">
            <!-- Items will be added dynamically -->
        </div>

        <button type="button" id="addItemBtn">+ Add Item</button>
        <button type="submit" id="createContractBtn">Create Contract</button>

    </form>

     <script src="/scripts/createContract.js"></script>
</body>
</html>
