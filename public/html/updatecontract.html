<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Update contract</title>
        <link rel="stylesheet" href="/css/updatecontract.css">
    </head>
    
    <body>
        
        <h1>Update contract</h1>

        <a id="backButton" href="/contracts">Back</a>
               
        <form id="contractForm">
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required>
            
            <label for="purpose">Purpose:</label>
            <input type="text" id="purpose" name="purpose" required>
            
            <label for="conclusionDate">Conclusion Date:</label>
            <input type="date" id="conclusionDate" name="conclusionDate" required>
            
            <label for="expirationDate">Expiration Date:</label>    
            <input type="date" id="expirationDate" name="expirationDate" required>
            
            <label for="conditions">Conditions:</label>    
            <textarea id="conditions" name="conditions" required></textarea>
            
            <label for="status">Status:</label>    
            <select id="status" name="status" required>
            <option value="Active">Active</option>
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Failed">Failed</option>
            </select>
            
            
            <label for="supplierSelect">Supplier:</label>
            <select id="supplierSelect" name="supplierId" required></select>
            
            <label for="deliveryDate">Delivery Date:</label>
            <input type="date" id="deliveryDate" name="deliveryDate" required>
            <label for="deliveryStatus">Delivery Status:</label>
            
      <select id="deliveryStatus" name="deliveryStatus" required>
            <option value="Finished">Finished</option>
            <option value="Active">Active</option>
            <option value="Incomplete">Incomplete</option>
            <option value="Suspended">Suspended</option>
        </select>
            
            
            <h3>Contract items</h3>
            <div id="itemsContainer"></div>
            <button type="button" id="addItemBtn">Add item</button>
            
            
            <h3>Linked invoice items</h3>
            <div id="invoiceItemsContainer"></div>
            
            <button id="updateContractBtn" type="submit">Update contract</button>

            
        </form>

        <script src="/scripts/updateContract.js"></script>

    </body>
</html>
