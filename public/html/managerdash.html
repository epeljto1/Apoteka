<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manager Dashboard</title>
  <link rel="stylesheet" href="/public/css/style.css">
  <style>
    .dashboard-buttons {
      display: flex;
      gap: 20px;
      margin-top: 50px;
      justify-content: center;
    }

    .dashboard-buttons button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #007BFF;
      color: white;
      transition: background-color 0.3s ease;
    }

    .dashboard-buttons button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Welcome, Manager!</h1>

  <div class="dashboard-buttons">
    <button id="deliveriesBtn"><a href="/deliveries">Deliveries</a></button>
    <button id="suppliersBtn">Suppliers</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <script src="scripts/managerDashboard.js"></script>
</body>
</html>
